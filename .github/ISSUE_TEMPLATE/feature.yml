name: 💡 Feature / New Detector Proposal
description: Propose a new authenticity detector, protocol check, or UI/CLI improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem or relay fraud pattern does this solve?
      description: Describe the blind spot, provider quirk, or feature gap.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Briefly describe how the probe or feature should work.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Category
      options:
        - New detector
        - New protocol support
        - Web UI / Compare / Pelican
        - CLI / Docker
        - Documentation
        - Other
    validations:
      required: true
