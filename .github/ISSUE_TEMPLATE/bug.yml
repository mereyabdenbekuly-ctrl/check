name: 🐛 Bug Report / Detector Issue
description: Report an unexpected check score, UI issue, or detector bug in CLODEX Check
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The most helpful context is a shareable **`/r/{job_id}` report link** from `check.clodex.xyz` — never paste raw API keys.

  - type: textarea
    id: description
    attributes:
      label: What happened vs. what did you expect?
      description: Describe the detector output and expected behavior.
      placeholder: |
        Example: `prompt_cache` reported fail on model X even though cache_read_input_tokens was returned.
    validations:
      required: true

  - type: input
    id: report_url
    attributes:
      label: Report URL (optional)
      description: Paste a link like `https://check.clodex.xyz/r/{job_id}` if reproduced on the web app.
      placeholder: https://check.clodex.xyz/r/abc12345

  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options:
        - Claude (Anthropic /v1/messages)
        - OpenAI / GPT (/v1/chat/completions)
        - Gemini (/chat/completions)
        - Pelican SVG (/pelican)
        - Compare (/compare)
        - CLI / Docker
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Online service (check.clodex.xyz)
        - Self-hosted Docker
        - Local Python / CLI
    validations:
      required: true
